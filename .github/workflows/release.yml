name: Release

# A release stays DRAFT until a maintainer reviews every signed artifact and the
# final updater manifest. Parallel builders never publish latest.json; the
# finalize job is its sole owner after all three supported targets succeed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version tag to build (for example v0.1.11)'
        required: true

# A tag owns one draft asset set at a time. In particular, do not allow two
# manual/tag runs to interleave platform uploads and finalizers for one release.
concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate stable tag and protected signing configuration
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.version || github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be stable exact SemVer with a leading v." >&2
            exit 1
          fi
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing protected secret: TAURI_SIGNING_PRIVATE_KEY" >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "Missing protected secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >&2; exit 1; }

          VERSION="${TAG#v}"
          find_release() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -s --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]'
          }

          RELEASES="$(find_release)"
          RELEASE_COUNT="$(jq 'length' <<<"$RELEASES")"
          test "$RELEASE_COUNT" -le 1 || {
            echo "Multiple releases already use tag name $TAG; refusing an ambiguous build." >&2
            exit 1
          }
          if [[ "$RELEASE_COUNT" == "1" ]]; then
            test "$(jq -r '.[0].draft' <<<"$RELEASES")" = "true" || {
              echo "Refusing to replace artifacts under an already-published tag: $TAG" >&2
              exit 1
            }
          else
            RELEASE="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Omnicross $TAG" \
              -f body="Signed draft generated by the release workflow. Review updater assets and latest.json before publishing." \
              -F draft=true)"
            # Use the authoritative create response. A just-created draft may not
            # appear in a follow-up list call immediately.
            RELEASES="$(jq -cn --argjson release "$RELEASE" '[$release]')"
          fi

          # A draft release is intentionally untagged until publication. Resolve
          # its target through the Releases API and pin every downstream checkout
          # to that immutable commit rather than assuming refs/tags/$TAG exists.
          RELEASE_ID="$(jq -r '.[0].id' <<<"$RELEASES")"
          RELEASE_TARGET="$(jq -r '.[0].target_commitish' <<<"$RELEASES")"
          RELEASE_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TARGET" --jq .sha)"
          EXPECTED_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .sha)"
          test "$RELEASE_COMMIT" = "$EXPECTED_COMMIT" || {
            echo "Draft $TAG targets a different commit; refusing to mix release artifacts." >&2
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Signed universal .app.tar.gz updater; DMG remains manual-only.
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            node-target: darwin-universal
            args: '--target universal-apple-darwin --bundles app,dmg'
          # Signed AppImage updater; deb/rpm remain manual-only.
          - platform: ubuntu-22.04
            rust-targets: ''
            node-target: ''
            args: '--bundles appimage,deb,rpm'
          # Signed NSIS updater; MSI remains manual-only.
          - platform: windows-latest
            rust-targets: ''
            node-target: ''
            args: '--bundles nsis,msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file wget

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace dependencies
        run: npm ci

      - name: Sync app version from tag
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          node -e "const fs=require('fs');const p='apps/desktop/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version='$VERSION';fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"

      - name: Stage daemon runtime and bundled Node.js
        run: npm run stage-daemon -w omnicross-desktop
        env:
          OMNICROSS_NODE_TARGET: ${{ matrix.node-target }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build and upload signed artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  finalize-updater:
    needs: [prepare-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Rust signature verifier
        uses: dtolnay/rust-toolchain@stable

      - name: Download all draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Verify signed artifacts, then assemble and validate the sole updater manifest
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          node -e "const fs=require('fs');const p='apps/desktop/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version='$VERSION';fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
          node scripts/updater-contract.mjs \
            --assets release-assets \
            --output latest.json \
            --tag "$TAG" \
            --tauri-config apps/desktop/src-tauri/tauri.conf.json \
            --repository "$GITHUB_REPOSITORY"

      - name: Upload latest.json to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify the uploaded manifest byte-for-byte
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          mkdir uploaded
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir uploaded
          cmp latest.json uploaded/latest.json
          node scripts/updater-contract.mjs \
            --manifest uploaded/latest.json \
            --tag "$TAG" \
            --tauri-config apps/desktop/src-tauri/tauri.conf.json \
            --repository "$GITHUB_REPOSITORY"
