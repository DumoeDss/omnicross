<!--
  SYNTHETIC — not a capture. Hand-built for the recognized-but-empty case.

  Same reason as the Bing empty fixture: a zero-result SERP cannot be captured
  on demand without hammering a live engine with nonsense queries. Structure is
  derived from the recognition marker `isDuckDuckGoSerp` uses — the
  `#links`/`.results` container — as it appears in the captured

  `web-result`, and no `a.result-link`: any of those would make the page parse
  as a result set (or as the lite layout) instead of as empty. The no-results
  notice uses `no-results` for exactly that reason.
-->
